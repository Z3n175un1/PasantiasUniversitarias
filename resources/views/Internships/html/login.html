<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InternConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <header class="header-section">
                <div class="brand">
                    <i data-lucide="graduation-cap"></i>
                    <span>InternConnect</span>
                </div>
                <h1>Bienvenido</h1>
                <p>Ingresa para continuar a tu panel de control</p>
            </header>

            <div class="role-selector">
                <button class="role-btn active" data-role="student">Estudiante</button>
                <button class="role-btn" data-role="company">Empresa</button>
                <button class="role-btn" data-role="admin">Admin</button>
            </div>

            <form class="login-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-field">
                        <i data-lucide="mail"></i>
                        <input type="email" id="email" placeholder="tu@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-field">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-extras">
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Recordar contraseña
                    </label>
                    <a href="#" class="forgot-link">Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-submit">Iniciar sesión</button>
            </form>

            <footer class="card-footer">
                <p>No tienes una cuenta? <a href="../html/registro.html">Regístrate aquí</a></p>
                <p class="legal-text">Al iniciar sesión, aceptas nuestros Términos de Servicio y Política de Privacidad</p>
            </footer>
        </section>
    </main>

    <script src="../js/login.js"></script>
</body>
</html>
