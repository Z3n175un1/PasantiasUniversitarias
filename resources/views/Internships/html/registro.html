<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - InternConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <header class="header-section">
                <div class="brand">
                    <i data-lucide="graduation-cap"></i>
                    <span>InternConnect</span>
                </div>
                <h1>Crea una cuenta</h1>
                <p>Únete a miles de estudiantes y empresas</p>
            </header>

            <div class="role-selector">
                <button class="role-btn active" data-role="student">
                    <i data-lucide="graduation-cap" class="btn-icon"></i> Estudiante
                </button>
                <button class="role-btn" data-role="company">
                    <i data-lucide="building-2" class="btn-icon"></i> Compañía
                </button>
            </div>

            <form class="register-form">
                <div class="input-group">
                    <label for="fullname">Nombre Completo</label>
                    <div class="input-field">
                        <i data-lucide="user"></i>
                        <input type="text" id="fullname" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-field">
                        <i data-lucide="mail"></i>
                        <input type="email" id="email" placeholder="your@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-field">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirmar Password</label>
                    <div class="input-field">
                        <i data-lucide="lock"></i>
                        <input type="password" id="confirm-password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-extras">
                    <label class="checkbox-container">
                        <input type="checkbox" required>
                        <span class="checkmark"></span>
                        <span class="terms-text">Estoy de acuerdo con los <a href="#" class="link-blue">Términos de Servicio</a> y la <a href="#" class="link-blue">Política de Privacidad</a></span>
                    </label>
                </div>

                <button type="submit" class="btn-submit">Crea una cuenta</button>
            </form>

            <footer class="card-footer">
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </footer>
        </section>
    </main>

    <script src="../js/registro.js"></script>
</body>
</html>
